<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Notifications - CareerTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4 pb-5" style="max-width: 800px;">

    <div class="d-flex justify-content-between
                align-items-center mb-4 animate-fade-up">
        <h3 class="fw-bold mb-0">
            <i class="fas fa-bell text-primary me-2"></i>
            Notifications
        </h3>
        <form th:action="@{/notifications/read-all}"
              method="post">
            <button type="submit"
                    class="btn btn-sm btn-outline-primary">
                <i class="fas fa-check-double me-1"></i>
                Mark All as Read
            </button>
        </form>
    </div>

    <div th:if="${#lists.isEmpty(notifications)}"
         class="empty-state animate-fade-up">
        <div class="empty-state-icon">
            <i class="fas fa-bell-slash"></i>
        </div>
        <h5>No Notifications Yet!</h5>
        <p>Interview reminders and updates will show up here</p>
    </div>

    <div th:if="${!#lists.isEmpty(notifications)}"
         class="card animate-fade-up">
        <div class="card-body p-0">

            <div th:each="notification : ${notifications}"
                 class="d-flex align-items-start gap-3 p-3"
                 style="border-bottom: 1px solid #f5f5ff;"
                 th:style="${notification.isRead}
                     ? 'border-bottom:1px solid #f5f5ff;'
                     : 'border-bottom:1px solid #f5f5ff; background:rgba(99,102,241,0.05);'">

                <div style="width:42px; height:42px;
                            border-radius:12px;
                            display:flex; align-items:center;
                            justify-content:center;
                            flex-shrink:0;"
                     th:style="${notification.type == 'INTERVIEW_REMINDER'}
                        ? 'width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(0,212,170,0.1);color:var(--success);'
                        : 'width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--primary-light);color:var(--primary);'">
                    <i class="fas"
                       th:classappend="${notification.type == 'INTERVIEW_REMINDER'}
                           ? 'fa-calendar-day' : 'fa-briefcase'">
                    </i>
                </div>

                <div class="flex-grow-1">
                    <div class="d-flex justify-content-between
                                align-items-start">
                        <p class="fw-bold mb-1"
                           style="font-size:14px;"
                           th:text="${notification.title}">
                        </p>
                        <span th:if="${!notification.isRead}"
                              class="badge badge-scheduled">
                            New
                        </span>
                    </div>
                    <p class="text-muted mb-1"
                       style="font-size:13px;"
                       th:text="${notification.message}">
                    </p>
                    <small class="text-muted"
                           style="font-size:11px;">
                        <i class="fas fa-clock me-1"></i>
                        <span th:text="${notification.createdAt}"></span>
                    </small>
                </div>

                <form th:if="${!notification.isRead}"
                      th:action="@{/notifications/{id}/read(id=${notification.id})}"
                      method="post">
                    <button type="submit"
                            class="btn btn-sm btn-light"
                            title="Mark as read">
                        <i class="fas fa-check"></i>
                    </button>
                </form>

            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
