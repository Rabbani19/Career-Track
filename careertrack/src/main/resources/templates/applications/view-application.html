<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>View Application - CareerTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4 pb-5">

    <div class="d-flex justify-content-between
                align-items-center mb-4">
        <div class="d-flex align-items-center">
            <a href="/applications"
               class="btn btn-outline-secondary me-3">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div>
                <h3 class="fw-bold mb-0"
                    th:text="${application.jobRole}">
                </h3>
                <p class="text-muted mb-0"
                   th:text="${application.companyName}">
                </p>
            </div>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/applications/{id}/edit
                    (id=${application.id})}"
               class="btn btn-warning">
                <i class="fas fa-edit me-1"></i> Edit
            </a>
            <form th:action="@{/applications/{id}/delete
                    (id=${application.id})}"
                  method="post"
                  onsubmit="return confirm(
                  'Delete this application?');">
                <button type="submit" class="btn btn-danger">
                    <i class="fas fa-trash me-1"></i> Delete
                </button>
            </form>
        </div>
    </div>

    <div class="row g-4">

        <div class="col-md-8">
            <div class="card mb-4">
                <div class="card-body p-4">

                    <div class="d-flex justify-content-between
                                align-items-center mb-3">
                        <span class="badge"
                              th:text="${application.status}"
                              th:classappend="${application.status.name() == 'APPLIED' ? 'badge-applied' :
                                (application.status.name() == 'IN_REVIEW' ? 'badge-in-review' :
                                (application.status.name() == 'SHORTLISTED' ? 'badge-shortlisted' :
                                (application.status.name() == 'OFFERED' ? 'badge-offered' : 'badge-rejected')))}">
</span>
                        <small class="text-muted"
                               th:if="${application.isRemote}">
                            <i class="fas fa-globe me-1"></i> Remote
                        </small>
                    </div>

                    <div th:if="${application.jobDescription}"
                         class="mb-3">
                        <h6 class="fw-bold">Job Description</h6>
                        <p class="text-muted"
                           style="white-space:pre-line;"
                           th:text="${application.jobDescription}">
                        </p>
                    </div>

                    <div th:if="${application.notes}">
                        <h6 class="fw-bold">Notes</h6>
                        <p class="text-muted"
                           style="white-space:pre-line;"
                           th:text="${application.notes}">
                        </p>
                    </div>

                </div>
            </div>

            <!-- Related Interviews -->
            <div class="card">
                <div class="card-header">
                    <h5 class="fw-bold mb-0">
                        <i class="fas fa-calendar-alt
                                  text-success me-2"></i>
                        Interviews
                    </h5>
                </div>
                <div class="card-body p-0">
                    <div th:if="${#lists.isEmpty(interviews)}"
                         class="empty-state">
                        <p class="text-muted mb-0">
                            No interviews scheduled for
                            this application yet
                        </p>
                    </div>
                    <div th:each="iv : ${interviews}"
                         class="d-flex justify-content-between
                                align-items-center p-3"
                         style="border-bottom:1px solid #f5f5ff;">
                        <div>
                            <p class="fw-bold mb-0"
                               style="font-size:14px;"
                               th:text="${iv.roundName
                                   ?: iv.roundType}">
                            </p>
                            <small class="text-muted"
                                   th:text="${iv.interviewDate}">
                            </small>
                        </div>
                        <span class="badge badge-scheduled"
                              th:text="${iv.status}"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <div class="card-body p-4">
                    <h6 class="fw-bold mb-3">Details</h6>

                    <div class="mb-3" th:if="${application.companyLocation}">
                        <small class="text-muted d-block">
                            <i class="fas fa-map-marker-alt me-1"></i>
                            Location
                        </small>
                        <span th:text="${application.companyLocation}"></span>
                    </div>

                    <div class="mb-3" th:if="${application.salaryRange}">
                        <small class="text-muted d-block">
                            <i class="fas fa-money-bill-wave me-1"></i>
                            Salary
                        </small>
                        <span th:text="${application.salaryRange}"></span>
                    </div>

                    <div class="mb-3" th:if="${application.appliedDate}">
                        <small class="text-muted d-block">
                            <i class="fas fa-calendar-alt me-1"></i>
                            Applied On
                        </small>
                        <span th:text="${application.appliedDate}"></span>
                    </div>

                    <div class="mb-3" th:if="${application.referralName}">
                        <small class="text-muted d-block">
                            <i class="fas fa-user-friends me-1"></i>
                            Referral
                        </small>
                        <span th:text="${application.referralName}"></span>
                    </div>

                    <div class="mb-0" th:if="${application.jobUrl}">
                        <small class="text-muted d-block">
                            <i class="fas fa-link me-1"></i>
                            Job Posting
                        </small>
                        <a th:href="${application.jobUrl}"
                           target="_blank"
                           style="font-size:13px;">
                            View Original Posting
                        </a>
                    </div>

                </div>
            </div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
