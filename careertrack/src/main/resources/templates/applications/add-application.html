<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Add Application - CareerTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<script>
    function toggleApplyBtn() {
        const input = document.getElementById('jobUrlInput');
        const btn = document.getElementById('applyNowBtn');
        const url = input.value.trim();

        if (url.startsWith('http://') || url.startsWith('https://')) {
            btn.href = url;
            btn.classList.remove('d-none');
        } else {
            btn.classList.add('d-none');
        }
    }
</script>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4 pb-5">

    <div class="d-flex align-items-center mb-4">
        <a href="/applications" class="btn btn-outline-secondary me-3">
            <i class="fas fa-arrow-left"></i>
        </a>
        <div>
            <h3 class="fw-bold mb-0">
                <i class="fas fa-file-alt text-primary me-2"></i>
                Add Application
            </h3>
            <p class="text-muted mb-0">
                Track a new job application
            </p>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-4">

            <form th:action="@{/applications/add}"
                  th:object="${applicationDTO}"
                  method="post">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label fw-bold">
                            <i class="fas fa-building text-primary"></i>
                            Company Name *
                        </label>
                        <input type="text" th:field="*{companyName}"
                               class="form-control"
                               placeholder="e.g. Google" required>
                        <small class="text-danger"
                               th:if="${#fields.hasErrors('companyName')}"
                               th:errors="*{companyName}"></small>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">
                            <i class="fas fa-user-tie text-primary"></i>
                            Job Role *
                        </label>
                        <input type="text" th:field="*{jobRole}"
                               class="form-control"
                               placeholder="e.g. Frontend Developer"
                               required>
                        <small class="text-danger"
                               th:if="${#fields.hasErrors('jobRole')}"
                               th:errors="*{jobRole}"></small>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">
                            <i class="fas fa-map-marker-alt
                                      text-primary"></i>
                            Location
                        </label>
                        <input type="text" th:field="*{companyLocation}"
                               class="form-control"
                               placeholder="e.g. Bengaluru">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">
                            <i class="fas fa-money-bill-wave
                                      text-primary"></i>
                            Salary Range
                        </label>
                        <input type="text" th:field="*{salaryRange}"
                               class="form-control"
                               placeholder="e.g. 8-12 LPA">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">
                            <i class="fas fa-calendar-alt
                                      text-primary"></i>
                            Applied Date
                        </label>
                        <input type="date" th:field="*{appliedDate}"
                               class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">
                            <i class="fas fa-flag text-primary"></i>
                            Status
                        </label>
                        <select th:field="*{status}" class="form-select">
                            <option th:each="s : ${statuses}"
                                    th:value="${s}"
                                    th:text="${s}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">
                            <i class="fas fa-link text-primary"></i>
                            Job URL
                        </label>
                        <div class="d-flex gap-2">
                            <input type="text" th:field="*{jobUrl}"
                                   id="jobUrlInput"
                                   class="form-control"
                                   placeholder="https://..."
                                   oninput="toggleApplyBtn()">
                            <a id="applyNowBtn"
                               href="#" target="_blank"
                               class="btn btn-success d-none"
                               style="white-space:nowrap;">
                                <i class="fas fa-external-link-alt me-1"></i>
                                Apply Now
                            </a>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">
                            <i class="fas fa-globe text-primary"></i>
                            Company Website
                        </label>
                        <input type="text" th:field="*{companyWebsite}"
                               class="form-control"
                               placeholder="https://...">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">
                            <i class="fas fa-user-friends
                                      text-primary"></i>
                            Referral Name
                        </label>
                        <input type="text" th:field="*{referralName}"
                               class="form-control"
                               placeholder="Optional">
                    </div>

                    <div class="col-md-6 d-flex align-items-end">
                        <div class="form-check">
                            <input type="checkbox"
                                   th:field="*{isRemote}"
                                   class="form-check-input">
                            <label class="form-check-label fw-bold">
                                Remote Position
                            </label>
                        </div>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-bold">
                            <i class="fas fa-align-left
                                      text-primary"></i>
                            Job Description
                        </label>
                        <textarea th:field="*{jobDescription}"
                                  class="form-control" rows="3"
                                  placeholder="Paste the job description...">
                        </textarea>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-bold">
                            <i class="fas fa-sticky-note
                                      text-primary"></i>
                            Notes
                        </label>
                        <textarea th:field="*{notes}"
                                  class="form-control" rows="3"
                                  placeholder="Any personal notes...">
                        </textarea>
                    </div>

                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit"
                            class="btn btn-primary px-4">
                        <i class="fas fa-check me-1"></i>
                        Save Application
                    </button>
                    <a href="/applications"
                       class="btn btn-secondary px-4">
                        Cancel
                    </a>
                </div>

            </form>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
