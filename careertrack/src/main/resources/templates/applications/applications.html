<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Applications - CareerTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4 pb-5">

    <!-- Page Header -->
    <div class="page-header animate-fade-up">
        <div class="page-header-title">
            <h3>
                <i class="fas fa-file-alt text-primary me-2"></i>
                Job Applications
            </h3>
            <p>Track and manage all your job applications</p>
        </div>
        <a href="/applications/add" class="btn btn-primary">
            <i class="fas fa-plus me-2"></i>
            Add Application
        </a>
    </div>

    <!-- Success Message -->
    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible
                animate-fade-up">
        <i class="fas fa-check-circle"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close"
                data-bs-dismiss="alert"></button>
    </div>

    <!-- Stats Row -->
    <div class="row g-3 mb-4">

        <div class="col-md-2 col-4 animate-fade-up delay-1">
            <div class="card text-center p-3">
                <div class="fw-bold fs-4 text-primary"
                     th:text="${stats.total}">0</div>
                <small class="text-muted fw-600">Total</small>
            </div>
        </div>

        <div class="col-md-2 col-4 animate-fade-up delay-2">
            <div class="card text-center p-3">
                <div class="fw-bold fs-4"
                     style="color:var(--info);"
                     th:text="${stats.applied}">0</div>
                <small class="text-muted fw-600">Applied</small>
            </div>
        </div>

        <div class="col-md-2 col-4 animate-fade-up delay-3">
            <div class="card text-center p-3">
                <div class="fw-bold fs-4"
                     style="color:var(--warning);"
                     th:text="${stats.inReview}">0</div>
                <small class="text-muted fw-600">In Review</small>
            </div>
        </div>

        <div class="col-md-2 col-4 animate-fade-up delay-4">
            <div class="card text-center p-3">
                <div class="fw-bold fs-4 text-primary"
                     th:text="${stats.shortlisted}">0</div>
                <small class="text-muted fw-600">Shortlisted</small>
            </div>
        </div>

        <div class="col-md-2 col-4 animate-fade-up delay-5">
            <div class="card text-center p-3">
                <div class="fw-bold fs-4"
                     style="color:var(--success);"
                     th:text="${stats.offered}">0</div>
                <small class="text-muted fw-600">Offered</small>
            </div>
        </div>

        <div class="col-md-2 col-4 animate-fade-up delay-6">
            <div class="card text-center p-3">
                <div class="fw-bold fs-4"
                     style="color:var(--danger);"
                     th:text="${stats.rejected}">0</div>
                <small class="text-muted fw-600">Rejected</small>
            </div>
        </div>

    </div>

    <!-- Filter -->
    <div class="card mb-4 animate-fade-up">
        <div class="card-body py-3">
            <div class="d-flex gap-2 flex-wrap
                        align-items-center">
                <span class="fw-bold text-muted me-2">
                    Filter:
                </span>
                <a href="/applications"
                   class="btn btn-sm"
                   th:classappend="${selectedStatus == null}
                   ? 'btn-primary' : 'btn-outline-secondary'">
                    All
                </a>
                <a th:each="status : ${statuses}"
                   th:href="@{/applications(status=${status})}"
                   th:text="${status}"
                   class="btn btn-sm"
                   th:classappend="${selectedStatus == status}
                   ? 'btn-primary' : 'btn-outline-secondary'">
                </a>
            </div>
        </div>
    </div>

    <!-- Applications List -->
    <div class="card animate-fade-up">
        <div class="card-body p-0">

            <!-- Empty State -->
            <div th:if="${#lists.isEmpty(applications)}"
                 class="empty-state">
                <div class="empty-state-icon">
                    <i class="fas fa-file-alt"></i>
                </div>
                <h5>No Applications Found!</h5>
                <p>Start tracking your job applications</p>
                <a href="/applications/add"
                   class="btn btn-primary">
                    <i class="fas fa-plus me-1"></i>
                    Add First Application
                </a>
            </div>

            <!-- Table -->
            <div th:if="${!#lists.isEmpty(applications)}"
                 class="table-responsive">
                <table class="table mb-0">
                    <thead>
                    <tr style="background:#f8f9ff;">
                        <th style="padding:15px 20px;
                                       color:#888;font-size:12px;
                                       text-transform:uppercase;
                                       letter-spacing:1px;
                                       font-weight:600;
                                       border:none;">#</th>
                        <th style="padding:15px 20px;
                                       color:#888;font-size:12px;
                                       text-transform:uppercase;
                                       letter-spacing:1px;
                                       font-weight:600;
                                       border:none;">Company</th>
                        <th style="padding:15px 20px;
                                       color:#888;font-size:12px;
                                       text-transform:uppercase;
                                       letter-spacing:1px;
                                       font-weight:600;
                                       border:none;">Role</th>
                        <th style="padding:15px 20px;
                                       color:#888;font-size:12px;
                                       text-transform:uppercase;
                                       letter-spacing:1px;
                                       font-weight:600;
                                       border:none;">Location</th>
                        <th style="padding:15px 20px;
                                       color:#888;font-size:12px;
                                       text-transform:uppercase;
                                       letter-spacing:1px;
                                       font-weight:600;
                                       border:none;">Date</th>
                        <th style="padding:15px 20px;
                                       color:#888;font-size:12px;
                                       text-transform:uppercase;
                                       letter-spacing:1px;
                                       font-weight:600;
                                       border:none;">Status</th>
                        <th style="padding:15px 20px;
                                       color:#888;font-size:12px;
                                       text-transform:uppercase;
                                       letter-spacing:1px;
                                       font-weight:600;
                                       border:none;">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="app, iter : ${applications}"
                        style="border-bottom:1px solid #f5f5ff;
                                   transition:all 0.2s ease;"
                        onmouseover="this.style.background='#f8f9ff'"
                        onmouseout="this.style.background='white'">

                        <td style="padding:18px 20px;
                                       vertical-align:middle;
                                       border:none;
                                       color:#888;
                                       font-weight:600;"
                            th:text="${iter.count}">
                        </td>

                        <td style="padding:18px 20px;
                                       vertical-align:middle;
                                       border:none;">
                            <div class="d-flex
                                            align-items-center gap-2">
                                <div style="width:38px;
                                                height:38px;
                                                background:var(--primary-light);
                                                border-radius:10px;
                                                display:flex;
                                                align-items:center;
                                                justify-content:center;
                                                font-weight:800;
                                                color:var(--primary);"
                                     th:text="${#strings.substring(
                                         app.companyName,0,1)}">
                                </div>
                                <span class="fw-bold"
                                      style="font-size:14px;"
                                      th:text="${app.companyName}">
                                    </span>
                            </div>
                        </td>

                        <td style="padding:18px 20px;
                                       vertical-align:middle;
                                       border:none;
                                       font-size:14px;"
                            th:text="${app.jobRole}">
                        </td>

                        <td style="padding:18px 20px;
                                       vertical-align:middle;
                                       border:none;
                                       font-size:14px;
                                       color:#888;"
                            th:text="${app.companyLocation ?: '-'}">
                        </td>

                        <td style="padding:18px 20px;
                                       vertical-align:middle;
                                       border:none;
                                       font-size:14px;
                                       color:#888;"
                            th:text="${app.appliedDate ?: '-'}">
                        </td>

                        <td style="padding:18px 20px;
                                       vertical-align:middle;
                                       border:none;">
                                <span class="badge"
                                      th:text="${app.status}"
                                      th:classappend="
                                      ${app.status.name() == 'APPLIED'}
                                      ? 'badge-applied' :
                                      ${app.status.name() == 'IN_REVIEW'}
                                      ? 'badge-in-review' :
                                      ${app.status.name() == 'SHORTLISTED'}
                                      ? 'badge-shortlisted' :
                                      ${app.status.name() == 'OFFERED'}
                                      ? 'badge-offered' :
                                      'badge-rejected'">
                                </span>
                        </td>

                        <td style="padding:18px 20px;
                                       vertical-align:middle;
                                       border:none;">
                            <div class="d-flex gap-2">
                                <a th:href="@{/applications/{id}
                                       (id=${app.id})}"
                                   class="btn btn-sm btn-primary"
                                   data-bs-toggle="tooltip"
                                   title="View">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <a th:href="@{/applications/{id}/edit
                                       (id=${app.id})}"
                                   class="btn btn-sm btn-warning"
                                   data-bs-toggle="tooltip"
                                   title="Edit">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <form th:action="@{/applications/{id}/delete
                                          (id=${app.id})}"
                                      method="post"
                                      style="display:inline;">
                                    <button type="submit"
                                            class="btn btn-sm btn-danger"
                                            onclick="return confirm(
                                                'Delete this application?')"
                                            data-bs-toggle="tooltip"
                                            title="Delete">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>

                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
