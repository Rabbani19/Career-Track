<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CareerTrack</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0e2e;
            min-height: 100vh;
            /* ✅ FIX: Removed overflow:hidden - allows scrolling */
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ===== BACKGROUND ===== */
        .bg-effects {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .bg-circle-1 {
            position: absolute;
            top: -200px; left: -200px;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 8s ease-in-out infinite;
        }

        .bg-circle-2 {
            position: absolute;
            bottom: -200px; right: -200px;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(118, 75, 162, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 8s ease-in-out infinite reverse;
        }

        .bg-circle-3 {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 800px; height: 800px;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.05) 0%, transparent 70%);
            border-radius: 50%;
        }

        .bg-grid {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                    linear-gradient(rgba(102, 126, 234, 0.05) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(102, 126, 234, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            animation: floatParticle linear infinite;
            opacity: 0.4;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(-100px) rotate(720deg); opacity: 0; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        /* ===== WRAPPER ===== */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
        }

        /* ===== BRAND ===== */
        .brand-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
            text-decoration: none;
        }

        .logo-icon {
            width: 50px; height: 50px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: white;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .brand-name {
            font-size: 1.7rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== CARD ===== */
        .login-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 48px 44px;
            box-shadow:
                    0 30px 80px rgba(0, 0, 0, 0.4),
                    inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .card-title-main {
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
            text-align: center;
            margin-bottom: 8px;
        }

        .card-subtitle-main {
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 32px;
        }

        /* ===== ALERTS ===== */
        .alert-error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            color: #fca5a5;
            padding: 12px 16px;
            font-size: 0.88rem;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 12px;
            color: #86efac;
            padding: 12px 16px;
            font-size: 0.88rem;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .alert-success-stacked {
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 12px;
            color: #86efac;
            padding: 14px 16px;
            font-size: 0.88rem;
            margin-bottom: 24px;
        }

        .alert-success-stacked .alert-top-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .alert-success-action {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(34, 197, 94, 0.35);
            color: #86efac;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .alert-success-action:hover {
            background: rgba(34, 197, 94, 0.18);
            color: #bbf7d0;
            transform: translateY(-1px);
        }


        /* ===== FORM ===== */
        .form-label-custom {
            color: rgba(255,255,255,0.75);
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.35);
            font-size: 1rem;
            z-index: 2;
            pointer-events: none;
            transition: color 0.3s;
        }

        .form-input {
            width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            padding: 14px 16px 14px 46px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input::placeholder {
            color: rgba(255,255,255,0.25);
        }

        .form-input:focus {
            background: rgba(102, 126, 234, 0.1);
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
            color: #fff;
        }

        .form-input:focus + .input-icon {
            color: #667eea;
        }

        /* Eye Toggle */
        .eye-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255,255,255,0.35);
            cursor: pointer;
            font-size: 1rem;
            z-index: 3;
            padding: 4px;
            transition: color 0.3s;
        }

        .eye-btn:hover { color: #667eea; }

        /* Remember & Forgot */
        .extras-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .remember-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,0.55);
            font-size: 0.88rem;
            cursor: pointer;
        }

        .remember-label input {
            accent-color: #667eea;
            width: 16px;
            height: 16px;
        }

        .forgot-link {
            color: #a78bfa;
            font-size: 0.88rem;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.3s;
        }

        .forgot-link:hover { color: #667eea; }

        /* Submit */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 24px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }

        .divider-text {
            color: rgba(255,255,255,0.35);
            font-size: 0.82rem;
            white-space: nowrap;
        }

        /* Register prompt */
        .register-prompt {
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
        }

        .register-link {
            color: #a78bfa;
            font-weight: 700;
            text-decoration: none;
            transition: color 0.3s;
        }

        .register-link:hover { color: #667eea; }

        /* Feature Badges */
        .feature-badges {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 24px;
        }

        .feature-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50px;
            padding: 6px 14px;
            color: rgba(255,255,255,0.45);
            font-size: 0.78rem;
        }

        .feature-badge i { color: #667eea; }

        /* Back Home */
        .back-home {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: rgba(255,255,255,0.4);
            font-size: 0.85rem;
            text-decoration: none;
            margin-top: 20px;
            transition: color 0.3s;
        }

        .back-home:hover { color: #667eea; }

        /* Responsive */
        @media (max-width: 576px) {
            .login-card { padding: 36px 24px; }
            .card-title-main { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

<!-- Background -->
<div class="bg-effects">
    <div class="bg-grid"></div>
    <div class="bg-circle-1"></div>
    <div class="bg-circle-2"></div>
    <div class="bg-circle-3"></div>
    <div class="particle" style="width:4px;height:4px;background:#667eea;left:10%;animation-duration:15s;animation-delay:0s;"></div>
    <div class="particle" style="width:6px;height:6px;background:#764ba2;left:25%;animation-duration:20s;animation-delay:3s;"></div>
    <div class="particle" style="width:3px;height:3px;background:#00d2ff;left:50%;animation-duration:18s;animation-delay:6s;"></div>
    <div class="particle" style="width:5px;height:5px;background:#667eea;left:75%;animation-duration:22s;animation-delay:2s;"></div>
    <div class="particle" style="width:4px;height:4px;background:#a78bfa;left:90%;animation-duration:16s;animation-delay:8s;"></div>
</div>

<!-- Login Content -->
<div class="login-wrapper animate__animated animate__fadeInUp">

    <!-- Brand Logo -->
    <a href="/" class="brand-logo">
        <div class="logo-icon">
            <i class="bi bi-briefcase-fill"></i>
        </div>
        <span class="brand-name">CareerTrack</span>
    </a>

    <!-- Card -->
    <div class="login-card">

        <h2 class="card-title-main">Welcome Back! 👋</h2>
        <p class="card-subtitle-main">Sign in to continue your career journey</p>

        <!-- Error Alert -->
        <div th:if="${param.error}" class="alert-error">
            <i class="bi bi-exclamation-circle-fill"></i>
            Invalid username or password. Please try again.
        </div>

        <!-- Registered Success -->
        <div th:if="${param.registered}" class="alert-success">
            <i class="bi bi-check-circle-fill"></i>
            Account created! Please login.
        </div>

        <!-- Logout Success -->
        <div th:if="${param.logout}" class="alert-success-stacked">
            <div class="alert-top-row">
                <i class="bi bi-check-circle-fill"></i>
                Logged out successfully.
            </div>
            <a href="/" class="alert-success-action">
                <i class="bi bi-house-door-fill"></i>
                Back to Home
            </a>
        </div>

        <!-- Form -->
        <form th:action="@{/login}" method="post">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <!-- Username -->
            <div>
                <label class="form-label-custom">
                    <i class="bi bi-person me-1"></i> Username
                </label>
                <div class="input-wrapper">
                    <input type="text"
                           name="username"
                           class="form-input"
                           placeholder="Enter your username"
                           required
                           autocomplete="username">
                    <i class="bi bi-person-fill input-icon"></i>
                </div>
            </div>

            <!-- Password -->
            <div>
                <label class="form-label-custom">
                    <i class="bi bi-lock me-1"></i> Password
                </label>
                <div class="input-wrapper">
                    <input type="password"
                           name="password"
                           id="loginPassword"
                           class="form-input"
                           placeholder="Enter your password"
                           required
                           autocomplete="current-password">
                    <i class="bi bi-lock-fill input-icon"></i>
                    <button type="button" class="eye-btn" onclick="togglePass('loginPassword','loginEye')">
                        <i class="bi bi-eye-fill" id="loginEye"></i>
                    </button>
                </div>
            </div>

            <!-- Remember & Forgot -->
            <div class="extras-row">
                <label class="remember-label">
                    <input type="checkbox" name="remember-me">
                    Remember me
                </label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-submit">
                <i class="bi bi-box-arrow-in-right"></i>
                Sign In
            </button>

        </form>

        <!-- Divider -->
        <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-text">New to CareerTrack?</span>
            <div class="divider-line"></div>
        </div>

        <!-- Register Link -->
        <div class="register-prompt">
            <a href="/register" class="register-link">
                <i class="bi bi-person-plus-fill me-1"></i>
                Create New Account →
            </a>
        </div>

    </div>

    <!-- Badges -->
    <div class="feature-badges">
        <div class="feature-badge">
            <i class="bi bi-shield-lock-fill"></i> Secure Login
        </div>
        <div class="feature-badge">
            <i class="bi bi-lightning-fill"></i> Instant Access
        </div>
        <div class="feature-badge">
            <i class="bi bi-star-fill"></i> Free Forever
        </div>
    </div>

    <!-- Back Home -->
    <a href="/" class="back-home">
        <i class="bi bi-arrow-left"></i>
        Back to Home
    </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function togglePass(fieldId, iconId) {
        const field = document.getElementById(fieldId);
        const icon = document.getElementById(iconId);
        if (field.type === 'password') {
            field.type = 'text';
            icon.className = 'bi bi-eye-slash-fill';
        } else {
            field.type = 'password';
            icon.className = 'bi bi-eye-fill';
        }
    }
</script>
</body>
</html>
