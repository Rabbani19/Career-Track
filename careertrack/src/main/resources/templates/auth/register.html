<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CareerTrack</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0e2e;
            min-height: 100vh;
            /* ✅ FIX: Proper overflow settings */
            overflow-x: hidden;
            overflow-y: auto;
            padding: 40px 20px;
        }

        /* ===== BACKGROUND ===== */
        .bg-effects {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .bg-circle-1 {
            position: absolute;
            top: -200px; left: -200px;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(102,126,234,0.2) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 8s ease-in-out infinite;
        }

        .bg-circle-2 {
            position: absolute;
            bottom: -200px; right: -200px;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(118,75,162,0.2) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 8s ease-in-out infinite reverse;
        }

        .bg-grid {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                    linear-gradient(rgba(102,126,234,0.05) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(102,126,234,0.05) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            animation: floatParticle linear infinite;
            opacity: 0.4;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(-100px); opacity: 0; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* ===== LAYOUT ===== */
        .page-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* ===== BRAND ===== */
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            text-decoration: none;
        }

        .logo-icon {
            width: 50px; height: 50px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: white;
            box-shadow: 0 8px 25px rgba(102,126,234,0.4);
        }

        .brand-name {
            font-size: 1.7rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== CARD ===== */
        .register-card {
            width: 100%;
            max-width: 520px;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px;
            padding: 48px 44px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.4),
            inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .card-title-main {
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
            text-align: center;
            margin-bottom: 8px;
        }

        .card-subtitle-main {
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 32px;
        }

        /* ===== ALERTS ===== */
        .alert-error {
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 12px;
            color: #fca5a5;
            padding: 12px 16px;
            font-size: 0.88rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ===== FORM ===== */
        .form-label-custom {
            color: rgba(255,255,255,0.75);
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 18px;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.35);
            font-size: 1rem;
            z-index: 2;
            pointer-events: none;
            transition: color 0.3s;
        }

        .form-input {
            width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 0.92rem;
            font-family: 'Poppins', sans-serif;
            padding: 13px 16px 13px 46px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input::placeholder {
            color: rgba(255,255,255,0.25);
        }

        .form-input:focus {
            background: rgba(102,126,234,0.1);
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.15);
            color: #fff;
        }

        /* Eye Toggle */
        .eye-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255,255,255,0.35);
            cursor: pointer;
            font-size: 1rem;
            z-index: 3;
            padding: 4px;
            transition: color 0.3s;
        }

        .eye-btn:hover { color: #667eea; }

        /* Password Strength */
        .strength-wrap {
            margin-top: -10px;
            margin-bottom: 16px;
        }

        .strength-bar {
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .strength-fill {
            height: 100%;
            border-radius: 2px;
            width: 0%;
            transition: all 0.4s ease;
        }

        .strength-text {
            font-size: 0.76rem;
            color: rgba(255,255,255,0.45);
        }

        /* Two Columns */
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        /* Terms */
        .terms-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 22px;
            margin-top: 4px;
        }

        .terms-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            accent-color: #667eea;
            cursor: pointer;
            flex-shrink: 0;
        }

        .terms-row label {
            color: rgba(255,255,255,0.5);
            font-size: 0.84rem;
            line-height: 1.5;
            cursor: pointer;
        }

        .terms-row a {
            color: #a78bfa;
            text-decoration: none;
            font-weight: 500;
        }

        /* Submit */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(102,126,234,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102,126,234,0.6);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 22px 0;
        }

        .divider-line {
            flex: 1; height: 1px;
            background: rgba(255,255,255,0.1);
        }

        .divider-text {
            color: rgba(255,255,255,0.35);
            font-size: 0.82rem;
            white-space: nowrap;
        }

        .login-prompt {
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
        }

        .login-link {
            color: #a78bfa;
            font-weight: 700;
            text-decoration: none;
            transition: color 0.3s;
        }

        .login-link:hover { color: #667eea; }

        /* Badges */
        .benefit-badges {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 22px;
        }

        .benefit-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50px;
            padding: 6px 14px;
            color: rgba(255,255,255,0.45);
            font-size: 0.78rem;
        }

        .benefit-badge i { color: #667eea; }

        /* Back Home */
        .back-home {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: rgba(255,255,255,0.4);
            font-size: 0.85rem;
            text-decoration: none;
            margin-top: 20px;
            transition: color 0.3s;
        }

        .back-home:hover { color: #667eea; }

        /* Error highlight */
        .form-input.is-invalid {
            border-color: #ef4444 !important;
            box-shadow: 0 0 0 4px rgba(239,68,68,0.15) !important;
        }

        .error-msg {
            color: #fca5a5;
            font-size: 0.78rem;
            margin-top: -12px;
            margin-bottom: 12px;
            display: none;
        }

        @media (max-width: 576px) {
            .register-card { padding: 36px 24px; }
            .two-col { grid-template-columns: 1fr; gap: 0; }
            .card-title-main { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

<!-- Background -->
<div class="bg-effects">
    <div class="bg-grid"></div>
    <div class="bg-circle-1"></div>
    <div class="bg-circle-2"></div>
    <div class="particle" style="width:4px;height:4px;background:#667eea;left:10%;animation-duration:15s;"></div>
    <div class="particle" style="width:6px;height:6px;background:#764ba2;left:30%;animation-duration:20s;animation-delay:3s;"></div>
    <div class="particle" style="width:3px;height:3px;background:#00d2ff;left:60%;animation-duration:18s;animation-delay:6s;"></div>
    <div class="particle" style="width:5px;height:5px;background:#a78bfa;left:85%;animation-duration:22s;animation-delay:2s;"></div>
</div>

<!-- Page Content -->
<div class="page-wrapper animate__animated animate__fadeInUp">

    <!-- Brand -->
    <a href="/" class="brand-logo">
        <div class="logo-icon">
            <i class="bi bi-briefcase-fill"></i>
        </div>
        <span class="brand-name">CareerTrack</span>
    </a>

    <!-- Card -->
    <div class="register-card">

        <h2 class="card-title-main">Create Account 🚀</h2>
        <p class="card-subtitle-main">Start your career journey — it's free!</p>

        <!-- ✅ Error from Controller -->
        <div th:if="${error}" class="alert-error">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span th:text="${error}">Registration failed.</span>
        </div>

        <!-- ✅ FIXED FORM - No th:object, plain name attributes -->
        <form action="/register" method="post" id="registerForm">

            <!-- CSRF Token (Spring Security) -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!-- First & Last Name -->
            <div class="two-col">
                <div>
                    <label class="form-label-custom">First Name *</label>
                    <div class="input-wrapper">
                        <i class="bi bi-person-fill input-icon"></i>
                        <input type="text"
                               name="firstName"
                               class="form-input"
                               placeholder="First name"
                               required
                               minlength="2">
                    </div>
                </div>
                <div>
                    <label class="form-label-custom">Last Name *</label>
                    <div class="input-wrapper">
                        <i class="bi bi-person-fill input-icon"></i>
                        <input type="text"
                               name="lastName"
                               class="form-input"
                               placeholder="Last name"
                               required
                               minlength="2">
                    </div>
                </div>
            </div>

            <!-- Username -->
            <label class="form-label-custom">Username *</label>
            <div class="input-wrapper">
                <i class="bi bi-at input-icon"></i>
                <input type="text"
                       name="username"
                       class="form-input"
                       placeholder="Choose a username"
                       required
                       minlength="3">
            </div>

            <!-- Email -->
            <label class="form-label-custom">Email Address *</label>
            <div class="input-wrapper">
                <i class="bi bi-envelope-fill input-icon"></i>
                <input type="email"
                       name="email"
                       class="form-input"
                       placeholder="Enter your email"
                       required>
            </div>

            <!-- Password -->
            <label class="form-label-custom">Password *</label>
            <div class="input-wrapper">
                <i class="bi bi-lock-fill input-icon"></i>
                <input type="password"
                       name="password"
                       id="regPassword"
                       class="form-input"
                       placeholder="Create a strong password"
                       required
                       minlength="6"
                       oninput="checkStrength(this.value)">
                <button type="button" class="eye-btn"
                        onclick="togglePass('regPassword','eyeReg1')">
                    <i class="bi bi-eye-fill" id="eyeReg1"></i>
                </button>
            </div>

            <!-- Password Strength -->
            <div class="strength-wrap">
                <div class="strength-bar">
                    <div class="strength-fill" id="strengthFill"></div>
                </div>
                <span class="strength-text" id="strengthText">Enter a password</span>
            </div>

            <!-- Confirm Password -->
            <label class="form-label-custom">Confirm Password *</label>
            <div class="input-wrapper">
                <i class="bi bi-lock-fill input-icon"></i>
                <input type="password"
                       name="confirmPassword"
                       id="confirmPass"
                       class="form-input"
                       placeholder="Confirm your password"
                       required>
                <button type="button" class="eye-btn"
                        onclick="togglePass('confirmPass','eyeReg2')">
                    <i class="bi bi-eye-fill" id="eyeReg2"></i>
                </button>
            </div>
            <div class="error-msg" id="passMatchError">
                ⚠️ Passwords do not match!
            </div>

            <!-- Terms -->
            <div class="terms-row">
                <input type="checkbox" id="terms" required>
                <label for="terms">
                    I agree to the <a href="#">Terms of Service</a> and
                    <a href="#">Privacy Policy</a>
                </label>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="bi bi-rocket-takeoff-fill"></i>
                Create My Account
            </button>

        </form>

        <!-- Divider -->
        <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-text">Already have an account?</span>
            <div class="divider-line"></div>
        </div>

        <div class="login-prompt">
            <a href="/login" class="login-link">
                <i class="bi bi-box-arrow-in-right me-1"></i>
                Sign In Instead →
            </a>
        </div>

    </div>

    <!-- Badges -->
    <div class="benefit-badges">
        <div class="benefit-badge">
            <i class="bi bi-shield-check-fill"></i> 100% Secure
        </div>
        <div class="benefit-badge">
            <i class="bi bi-gift-fill"></i> Free Forever
        </div>
        <div class="benefit-badge">
            <i class="bi bi-lightning-charge-fill"></i> Instant Setup
        </div>
    </div>

    <!-- Back Home -->
    <a href="/" class="back-home">
        <i class="bi bi-arrow-left"></i>
        Back to Home
    </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // ===== Password Toggle =====
    function togglePass(fieldId, iconId) {
        const field = document.getElementById(fieldId);
        const icon = document.getElementById(iconId);
        field.type = field.type === 'password' ? 'text' : 'password';
        icon.className = field.type === 'password'
            ? 'bi bi-eye-fill'
            : 'bi bi-eye-slash-fill';
    }

    // ===== Password Strength =====
    function checkStrength(password) {
        const fill = document.getElementById('strengthFill');
        const text = document.getElementById('strengthText');

        let score = 0;
        if (password.length >= 6)  score++;
        if (password.length >= 10) score++;
        if (/[A-Z]/.test(password)) score++;
        if (/[0-9]/.test(password)) score++;
        if (/[^A-Za-z0-9]/.test(password)) score++;

        const levels = [
            { pct: '20%', color: '#ef4444', label: '😟 Very Weak' },
            { pct: '40%', color: '#f97316', label: '😐 Weak' },
            { pct: '60%', color: '#eab308', label: '🙂 Fair' },
            { pct: '80%', color: '#22c55e', label: '😊 Good' },
            { pct: '100%', color: '#15803d', label: '💪 Strong' }
        ];

        if (password.length === 0) {
            fill.style.width = '0%';
            text.textContent = 'Enter a password';
            text.style.color = 'rgba(255,255,255,0.45)';
            return;
        }

        const level = levels[Math.min(score - 1, 4)];
        fill.style.width = level.pct;
        fill.style.background = level.color;
        text.textContent = level.label;
        text.style.color = level.color;
    }

    // ===== Real-time Password Match =====
    document.getElementById('confirmPass').addEventListener('input', function() {
        const pass = document.getElementById('regPassword').value;
        const confirm = this.value;
        const errorMsg = document.getElementById('passMatchError');

        if (confirm.length > 0 && pass !== confirm) {
            this.classList.add('is-invalid');
            errorMsg.style.display = 'block';
        } else {
            this.classList.remove('is-invalid');
            errorMsg.style.display = 'none';
        }
    });

    // ===== Form Submit Validation =====
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        const pass = document.getElementById('regPassword').value;
        const confirm = document.getElementById('confirmPass').value;

        if (pass !== confirm) {
            e.preventDefault();
            document.getElementById('passMatchError').style.display = 'block';
            document.getElementById('confirmPass').classList.add('is-invalid');
            document.getElementById('confirmPass').scrollIntoView({
                behavior: 'smooth', block: 'center'
            });
        }
    });
</script>
</body>
</html>
