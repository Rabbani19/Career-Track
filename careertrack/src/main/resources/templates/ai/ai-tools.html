<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>AI Career Assistant - CareerTrack</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4 pb-5">

    <div class="mb-4">
        <h3 class="fw-bold mb-0">
            <i class="fas fa-robot text-primary me-2"></i>
            AI Career Assistant
        </h3>
        <p class="text-muted mb-0">
            Get instant interview tips and mock questions,
            powered by AI
        </p>
    </div>

    <!-- Input Card -->
    <div class="card mb-4">
        <div class="card-body p-4">

            <div class="row g-3 align-items-end">

                <div class="col-md-4">
                    <label class="form-label fw-bold">
                        <i class="fas fa-briefcase text-primary"></i>
                        Pick from your applications
                    </label>
                    <select id="applicationSelect"
                            class="form-select">
                        <option value="">
                            -- or type manually below --
                        </option>
                        <option th:each="app : ${applications}"
                                th:value="${app.jobRole}
                                          + '|' + ${app.companyName}"
                                th:text="${app.jobRole}
                                          + ' at ' + ${app.companyName}">
                        </option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-bold">
                        <i class="fas fa-user-tie text-primary"></i>
                        Job Role *
                    </label>
                    <input type="text" id="jobRole"
                           class="form-control"
                           placeholder="e.g. Frontend Developer">
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-bold">
                        <i class="fas fa-building text-primary"></i>
                        Company (optional)
                    </label>
                    <input type="text" id="companyName"
                           class="form-control"
                           placeholder="e.g. Google">
                </div>

            </div>

            <div class="d-flex gap-2 mt-4">
                <button id="tipsBtn"
                        class="btn btn-primary px-4">
                    <i class="fas fa-lightbulb me-1"></i>
                    Get Interview Tips
                </button>
                <button id="questionsBtn"
                        class="btn btn-success px-4">
                    <i class="fas fa-question-circle me-1"></i>
                    Generate Mock Questions
                </button>
            </div>

            <div id="errorBox"
                 class="alert alert-danger mt-3 d-none"></div>

        </div>
    </div>

    <!-- Results -->
    <div class="row g-4">

        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-header">
                    <h5 class="fw-bold mb-0">
                        <i class="fas fa-lightbulb
                                  text-warning me-2"></i>
                        Interview Tips
                    </h5>
                </div>
                <div class="card-body" id="tipsResults">
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <i class="fas fa-lightbulb"></i>
                        </div>
                        <p class="text-muted mb-0">
                            Fill the form above and click
                            "Get Interview Tips"
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-header">
                    <h5 class="fw-bold mb-0">
                        <i class="fas fa-question-circle
                                  text-success me-2"></i>
                        Mock Interview Questions
                    </h5>
                </div>
                <div class="card-body" id="questionsResults">
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <i class="fas fa-question-circle"></i>
                        </div>
                        <p class="text-muted mb-0">
                            Fill the form above and click
                            "Generate Mock Questions"
                        </p>
                    </div>
                </div>
            </div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>

<script>
    const csrfToken = document.querySelector(
        'meta[name="_csrf"]').content;
    const csrfHeader = document.querySelector(
        'meta[name="_csrf_header"]').content;

    // Auto-fill role/company when picking an existing application
    document.getElementById('applicationSelect')
        .addEventListener('change', function () {
            if (!this.value) return;
            const [role, company] = this.value.split('|');
            document.getElementById('jobRole').value = role;
            document.getElementById('companyName').value = company;
        });

    function showLoading(containerId) {
        document.getElementById(containerId).innerHTML =
            '<div class="text-center py-4">' +
            '<div class="spinner-border text-primary"></div>' +
            '<p class="text-muted mt-2 mb-0">Generating...</p>' +
            '</div>';
    }

    function renderList(containerId, items, iconClass) {
        let html = '<div class="d-flex flex-column gap-2">';
        items.forEach(item => {
            html += '<div class="d-flex gap-2 align-items-start ' +
                'p-2" style="border-bottom:1px solid #f5f5ff;">' +
                '<i class="' + iconClass +
                ' text-primary mt-1"></i>' +
                '<span style="font-size:14px;">' + item +
                '</span></div>';
        });
        html += '</div>';
        document.getElementById(containerId).innerHTML = html;
    }

    function showError(message) {
        const box = document.getElementById('errorBox');
        box.textContent = message;
        box.classList.remove('d-none');
    }

    async function callAi(endpoint, resultContainerId, iconClass) {

        const jobRole = document.getElementById('jobRole').value.trim();
        const companyName =
            document.getElementById('companyName').value.trim();

        document.getElementById('errorBox').classList.add('d-none');

        if (!jobRole) {
            showError('Please enter a job role first.');
            return;
        }

        showLoading(resultContainerId);

        try {
            const response = await fetch('/ai/' + endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    [csrfHeader]: csrfToken
                },
                body: JSON.stringify({ jobRole, companyName })
            });

            const result = await response.json();

            if (result.success) {
                renderList(resultContainerId, result.data, iconClass);
            } else {
                showError(result.message ||
                    'Something went wrong. Please try again.');
                document.getElementById(resultContainerId)
                    .innerHTML = '';
            }

        } catch (e) {
            showError('Could not reach the AI service. ' +
                'Please try again.');
        }
    }

    document.getElementById('tipsBtn')
        .addEventListener('click', () =>
            callAi('tips', 'tipsResults',
                'fas fa-check-circle'));

    document.getElementById('questionsBtn')
        .addEventListener('click', () =>
            callAi('questions', 'questionsResults',
                'fas fa-arrow-right'));
</script>
</body>
</html>
