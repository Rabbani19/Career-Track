<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CareerTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4 pb-5">

    <div class="d-flex justify-content-between
                align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-0">
                <i class="fas fa-shield-alt text-primary me-2"></i>
                Admin Dashboard
            </h3>
            <p class="text-muted mb-0">
                System overview and analytics
            </p>
        </div>
        <a href="/admin/users" class="btn btn-primary">
            <i class="fas fa-users-cog me-1"></i>
            Manage Users
        </a>
    </div>

    <h6 class="fw-bold text-muted mb-2">USERS</h6>
    <div class="row g-4 mb-4">

        <div class="col-lg-3 col-md-6">
            <div class="stat-card stat-primary">
                <div class="stat-card-icon">
                    <i class="fas fa-users"></i>
                </div>
                <div class="stat-number"
                     th:text="${stats.totalUsers}">0</div>
                <div class="stat-label">Total Users</div>
            </div>
        </div>

        <div class="col-lg-3 col-md-6">
            <div class="stat-card stat-success">
                <div class="stat-card-icon">
                    <i class="fas fa-user-check"></i>
                </div>
                <div class="stat-number"
                     th:text="${stats.activeUsers}">0</div>
                <div class="stat-label">Active Users</div>
            </div>
        </div>

        <div class="col-lg-3 col-md-6">
            <div class="stat-card stat-warning">
                <div class="stat-card-icon">
                    <i class="fas fa-user-slash"></i>
                </div>
                <div class="stat-number"
                     th:text="${stats.inactiveUsers}">0</div>
                <div class="stat-label">Inactive Users</div>
            </div>
        </div>

        <div class="col-lg-3 col-md-6">
            <div class="stat-card stat-info">
                <div class="stat-card-icon">
                    <i class="fas fa-user-shield"></i>
                </div>
                <div class="stat-number"
                     th:text="${stats.adminCount}">0</div>
                <div class="stat-label">Admins</div>
            </div>
        </div>

    </div>

    <h6 class="fw-bold text-muted mb-2">PLATFORM ACTIVITY</h6>
    <div class="row g-4">

        <div class="col-lg-4 col-md-6">
            <div class="stat-card stat-primary">
                <div class="stat-card-icon">
                    <i class="fas fa-file-alt"></i>
                </div>
                <div class="stat-number"
                     th:text="${stats.totalApplications}">0</div>
                <div class="stat-label">
                    Total Applications Tracked
                </div>
            </div>
        </div>

        <div class="col-lg-4 col-md-6">
            <div class="stat-card stat-success">
                <div class="stat-card-icon">
                    <i class="fas fa-calendar-alt"></i>
                </div>
                <div class="stat-number"
                     th:text="${stats.totalInterviews}">0</div>
                <div class="stat-label">
                    Total Interviews Scheduled
                </div>
            </div>
        </div>

        <div class="col-lg-4 col-md-6">
            <div class="stat-card stat-warning">
                <div class="stat-card-icon">
                    <i class="fas fa-folder-open"></i>
                </div>
                <div class="stat-number"
                     th:text="${stats.totalDocuments}">0</div>
                <div class="stat-label">
                    Total Documents Uploaded
                </div>
            </div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
