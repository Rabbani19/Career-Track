<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Manage Users - CareerTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4 pb-5">

    <div class="d-flex align-items-center mb-4">
        <a href="/admin" class="btn btn-outline-secondary me-3">
            <i class="fas fa-arrow-left"></i>
        </a>
        <div>
            <h3 class="fw-bold mb-0">
                <i class="fas fa-users-cog text-primary me-2"></i>
                Manage Users
            </h3>
            <p class="text-muted mb-0">
                <span th:text="${#lists.size(users)}">0</span>
                registered users
            </p>
        </div>
    </div>

    <div th:if="${successMessage}"
         class="alert alert-success">
        <i class="fas fa-check-circle"></i>
        <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}"
         class="alert alert-danger">
        <i class="fas fa-exclamation-circle"></i>
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table mb-0">
                    <thead>
                    <tr style="background:#f8f9ff;">
                        <th style="padding:15px 20px;
                                       border:none;
                                       text-transform:uppercase;
                                       font-size:12px;
                                       color:#888;">User</th>
                        <th style="padding:15px 20px;
                                       border:none;
                                       text-transform:uppercase;
                                       font-size:12px;
                                       color:#888;">Email</th>
                        <th style="padding:15px 20px;
                                       border:none;
                                       text-transform:uppercase;
                                       font-size:12px;
                                       color:#888;">Role</th>
                        <th style="padding:15px 20px;
                                       border:none;
                                       text-transform:uppercase;
                                       font-size:12px;
                                       color:#888;">Status</th>
                        <th style="padding:15px 20px;
                                       border:none;
                                       text-transform:uppercase;
                                       font-size:12px;
                                       color:#888;">Joined</th>
                        <th style="padding:15px 20px;
                                       border:none;
                                       text-transform:uppercase;
                                       font-size:12px;
                                       color:#888;">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${users}"
                        style="border-bottom:1px solid #f5f5ff;">

                        <td style="padding:16px 20px;
                                       vertical-align:middle;
                                       border:none;">
                            <div class="d-flex align-items-center gap-2">
                                <div style="width:36px;height:36px;
                                            background:var(--primary-light);
                                            border-radius:10px;
                                            display:flex;
                                            align-items:center;
                                            justify-content:center;
                                            font-weight:800;
                                            color:var(--primary);"
                                     th:text="${#strings.substring(
                                     u.fullName,0,1)}">
                                </div>
                                <div>
                                    <p class="fw-bold mb-0"
                                       style="font-size:14px;"
                                       th:text="${u.fullName}"></p>
                                    <small class="text-muted"
                                           th:text="'@' + ${u.username}">
                                    </small>
                                </div>
                            </div>
                        </td>

                        <td style="padding:16px 20px;
                                       vertical-align:middle;
                                       border:none;font-size:13px;"
                            th:text="${u.email}"></td>

                        <td style="padding:16px 20px;
                                       vertical-align:middle;border:none;">
                            <span class="badge"
                                  th:text="${u.role}"
                                  th:classappend="${u.role.name() == 'ADMIN'}
                                  ? 'badge-offered' : 'badge-applied'">
                            </span>
                        </td>

                        <td style="padding:16px 20px;
                                       vertical-align:middle;border:none;">
                            <span class="badge"
                                  th:text="${u.active} ? 'Active' : 'Inactive'"
                                  th:classappend="${u.active}
                                  ? 'badge-shortlisted' : 'badge-rejected'">
                            </span>
                        </td>

                        <td style="padding:16px 20px;
                                       vertical-align:middle;
                                       border:none;font-size:13px;
                                       color:#888;"
                            th:text="${#temporals.format(
                            u.createdAt, 'dd MMM yyyy')}"></td>

                        <td style="padding:16px 20px;
                                       vertical-align:middle;border:none;">
                            <div class="d-flex gap-2 flex-wrap">

                                <form th:action="@{/admin/users/{id}/toggle-active
                                        (id=${u.id})}"
                                      method="post">
                                    <button type="submit"
                                            class="btn btn-sm"
                                            th:classappend="${u.active}
                                            ? 'btn-outline-warning'
                                            : 'btn-outline-success'"
                                            th:title="${u.active}
                                            ? 'Deactivate' : 'Activate'">
                                        <i class="fas"
                                           th:classappend="${u.active}
                                           ? 'fa-user-slash' : 'fa-user-check'">
                                        </i>
                                    </button>
                                </form>

                                <form th:action="@{/admin/users/{id}/role
                                        (id=${u.id})}"
                                      method="post"
                                      class="d-flex gap-1">
                                    <select name="role"
                                            class="form-select form-select-sm"
                                            style="width:auto;"
                                            onchange="this.form.submit()">
                                        <option th:each="r : ${roles}"
                                                th:value="${r}"
                                                th:text="${r}"
                                                th:selected="${r == u.role}">
                                        </option>
                                    </select>
                                </form>

                                <form th:action="@{/admin/users/{id}/delete
                                        (id=${u.id})}"
                                      method="post"
                                      onsubmit="return confirm(
                                      'Delete this user permanently?');">
                                    <button type="submit"
                                            class="btn btn-sm btn-outline-danger">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </form>

                            </div>
                        </td>

                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
