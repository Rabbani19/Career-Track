<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<nav th:fragment="navbar"
     class="navbar navbar-expand-lg navbar-custom">
    <div class="container">

        <!-- Brand -->
        <a class="navbar-brand fw-bold" href="/dashboard">
            🎯 CareerTrack
        </a>

        <!-- Toggle -->
        <button class="navbar-toggler border-0"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <i class="fas fa-bars text-white"></i>
        </button>

        <!-- Nav Links -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto ms-3">

                <li class="nav-item">
                    <a class="nav-link" href="/dashboard">
                        <i class="fas fa-chart-pie"></i>
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/applications">
                        <i class="fas fa-file-alt"></i>
                        Applications
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/interviews">
                        <i class="fas fa-calendar-alt"></i>
                        Interviews
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/documents">
                        <i class="fas fa-folder-open"></i>
                        Documents
                    </a>
                </li>

            </ul>

            <!-- Right Side -->
            <ul class="navbar-nav align-items-center gap-2">

                <!-- Notification Bell -->
                <li class="nav-item">
                    <a href="/notifications" class="nav-link p-0">
                        <div class="notification-wrapper">
                            <div class="notification-bell-icon">
                                <i class="fas fa-bell"></i>
                            </div>
                            <span class="notification-count">0</span>
                        </div>
                    </a>
                </li>

                <!-- User Dropdown -->
                <li class="nav-item dropdown ms-2">
                    <a class="nav-link dropdown-toggle p-0
                              d-flex align-items-center gap-2"
                       href="#"
                       data-bs-toggle="dropdown">
                        <div class="user-avatar">
                            <i class="fas fa-user"></i>
                        </div>
                        <span class="text-white d-none d-md-block"
                              style="font-size:13px;font-weight:600;"
                              sec:authentication="name">
                        </span>
                    </a>

                    <ul class="dropdown-menu dropdown-menu-end mt-2">

                        <!-- User Info Header -->
                        <li class="px-3 py-2 border-bottom mb-1">
                            <div class="d-flex align-items-center gap-2">
                                <div style="width:38px;height:38px;
                                            background:var(--gradient-primary);
                                            border-radius:50%;
                                            display:flex;
                                            align-items:center;
                                            justify-content:center;
                                            color:white;">
                                    <i class="fas fa-user"></i>
                                </div>
                                <div>
                                    <div class="fw-bold small"
                                         sec:authentication="name">
                                    </div>
                                    <div class="text-muted"
                                         style="font-size:11px;">
                                        Job Seeker
                                    </div>
                                </div>
                            </div>
                        </li>

                        <!-- Menu Items -->
                        <li>
                            <a class="dropdown-item" href="/profile">
                                <i class="fas fa-user-circle text-primary"></i>
                                My Profile
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item" href="/dashboard">
                                <i class="fas fa-chart-pie text-success"></i>
                                Dashboard
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item" href="/applications">
                                <i class="fas fa-file-alt text-info"></i>
                                Applications
                            </a>
                        </li>

                        <li><hr class="dropdown-divider"></li>

                        <!-- ✅ FIXED LOGOUT - POST Form -->
                        <li>
                            <form th:action="@{/logout}"
                                  method="post"
                                  class="m-0 p-0">

                                <!-- ✅ CSRF Token -->
                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}"/>

                                <button type="submit"
                                        class="dropdown-item text-danger">
                                    <i class="fas fa-sign-out-alt"></i>
                                    Logout
                                </button>

                            </form>
                        </li>

                    </ul>
                </li>

            </ul>
        </div>
    </div>
</nav>

</html>
