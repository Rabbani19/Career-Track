<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - CareerTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-0 shadow-sm">

                <div class="card-header bg-white">
                    <h5 class="fw-bold mb-0">
                        <i class="fas fa-edit
                                  text-primary">
                        </i>
                        Edit Profile
                    </h5>
                </div>

                <div class="card-body p-4">
                    <form th:action="@{/profile/edit}"
                          th:object="${userDTO}"
                          method="post">

                        <div class="row g-3">

                            <!-- Full Name -->
                            <div class="col-md-6">
                                <label class="form-label
                                              fw-bold">
                                    Full Name
                                </label>
                                <input type="text"
                                       th:field="*{fullName}"
                                       class="form-control">
                            </div>

                            <!-- Phone -->
                            <div class="col-md-6">
                                <label class="form-label
                                              fw-bold">
                                    Phone
                                </label>
                                <input type="text"
                                       th:field="*{phone}"
                                       class="form-control">
                            </div>

                            <!-- Location -->
                            <div class="col-md-6">
                                <label class="form-label
                                              fw-bold">
                                    Location
                                </label>
                                <input type="text"
                                       th:field="*{location}"
                                       class="form-control">
                            </div>

                            <!-- Experience -->
                            <div class="col-md-6">
                                <label class="form-label
                                              fw-bold">
                                    Experience (Years)
                                </label>
                                <input type="number"
                                       th:field="*{experienceYears}"
                                       class="form-control">
                            </div>

                            <!-- Current Company -->
                            <div class="col-md-6">
                                <label class="form-label
                                              fw-bold">
                                    Current Company
                                </label>
                                <input type="text"
                                       th:field="*{currentCompany}"
                                       class="form-control">
                            </div>

                            <!-- Current Role -->
                            <div class="col-md-6">
                                <label class="form-label
                                              fw-bold">
                                    Current Role
                                </label>
                                <input type="text"
                                       th:field="*{currentRole}"
                                       class="form-control">
                            </div>

                            <!-- Skills -->
                            <div class="col-12">
                                <label class="form-label
                                              fw-bold">
                                    Skills
                                </label>
                                <input type="text"
                                       th:field="*{skills}"
                                       class="form-control"
                                       placeholder="Java, Spring Boot, MySQL...">
                            </div>

                            <!-- LinkedIn -->
                            <div class="col-md-6">
                                <label class="form-label
                                              fw-bold">
                                    LinkedIn URL
                                </label>
                                <input type="text"
                                       th:field="*{linkedinUrl}"
                                       class="form-control">
                            </div>

                            <!-- GitHub -->
                            <div class="col-md-6">
                                <label class="form-label
                                              fw-bold">
                                    GitHub URL
                                </label>
                                <input type="text"
                                       th:field="*{githubUrl}"
                                       class="form-control">
                            </div>

                        </div>

                        <!-- Buttons -->
                        <div class="mt-4 d-flex gap-2">
                            <button type="submit"
                                    class="btn btn-primary">
                                <i class="fas fa-save">
                                </i> Save Changes
                            </button>
                            <a href="/profile"
                               class="btn btn-secondary">
                                Cancel
                            </a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
