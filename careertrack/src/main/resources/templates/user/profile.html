<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profile - CareerTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4 pb-5">

    <!-- Success Message -->
    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible
                animate-fade-up">
        <i class="fas fa-check-circle"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close"
                data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">

        <!-- Profile Card -->
        <div class="col-md-4 animate-fade-left">
            <div class="card text-center p-4">

                <!-- Avatar -->
                <div style="width:100px;height:100px;
                            background:var(--gradient-primary);
                            border-radius:50%;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            margin:0 auto 20px;
                            box-shadow:var(--shadow-primary);">
                    <i class="fas fa-user text-white"
                       style="font-size:40px;"></i>
                </div>

                <h4 class="fw-bold mb-1"
                    th:text="${user.fullName}">
                    User Name
                </h4>
                <p class="text-muted mb-2"
                   th:text="${user.email}">
                </p>
                <span class="badge badge-scheduled mb-3"
                      th:text="${user.role}">
                    USER
                </span>

                <div class="d-grid">
                    <a href="/profile/edit"
                       class="btn btn-primary">
                        <i class="fas fa-edit me-2"></i>
                        Edit Profile
                    </a>
                </div>

                <hr class="my-3">

                <!-- Quick Stats -->
                <div class="row text-center">
                    <div class="col-6">
                        <div class="fw-bold text-primary fs-4">
                            0
                        </div>
                        <small class="text-muted">Applied</small>
                    </div>
                    <div class="col-6">
                        <div class="fw-bold text-success fs-4">
                            0
                        </div>
                        <small class="text-muted">Interviews</small>
                    </div>
                </div>

            </div>
        </div>

        <!-- Profile Details -->
        <div class="col-md-8 animate-fade-right">
            <div class="card">
                <div class="card-header">
                    <h5 class="fw-bold mb-0">
                        <i class="fas fa-user-circle
                                  text-primary me-2"></i>
                        Profile Information
                    </h5>
                </div>
                <div class="card-body">
                    <div class="row g-4">

                        <div class="col-md-6">
                            <label class="text-muted small
                                         text-uppercase
                                         fw-bold"
                                   style="letter-spacing:1px;
                                          font-size:11px;">
                                Full Name
                            </label>
                            <p class="fw-bold mb-0 mt-1"
                               th:text="${user.fullName ?: '-'}">
                            </p>
                        </div>

                        <div class="col-md-6">
                            <label class="text-muted small
                                         text-uppercase fw-bold"
                                   style="letter-spacing:1px;
                                          font-size:11px;">
                                Email
                            </label>
                            <p class="fw-bold mb-0 mt-1"
                               th:text="${user.email ?: '-'}">
                            </p>
                        </div>

                        <div class="col-md-6">
                            <label class="text-muted small
                                         text-uppercase fw-bold"
                                   style="letter-spacing:1px;
                                          font-size:11px;">
                                Phone
                            </label>
                            <p class="fw-bold mb-0 mt-1"
                               th:text="${user.phone ?: '-'}">
                            </p>
                        </div>

                        <div class="col-md-6">
                            <label class="text-muted small
                                         text-uppercase fw-bold"
                                   style="letter-spacing:1px;
                                          font-size:11px;">
                                Location
                            </label>
                            <p class="fw-bold mb-0 mt-1"
                               th:text="${user.location ?: '-'}">
                            </p>
                        </div>

                        <div class="col-md-6">
                            <label class="text-muted small
                                         text-uppercase fw-bold"
                                   style="letter-spacing:1px;
                                          font-size:11px;">
                                Current Company
                            </label>
                            <p class="fw-bold mb-0 mt-1"
                               th:text="${user.currentCompany ?: '-'}">
                            </p>
                        </div>

                        <div class="col-md-6">
                            <label class="text-muted small
                                         text-uppercase fw-bold"
                                   style="letter-spacing:1px;
                                          font-size:11px;">
                                Current Role
                            </label>
                            <p class="fw-bold mb-0 mt-1"
                               th:text="${user.currentRole ?: '-'}">
                            </p>
                        </div>

                        <div class="col-md-6">
                            <label class="text-muted small
                                         text-uppercase fw-bold"
                                   style="letter-spacing:1px;
                                          font-size:11px;">
                                Experience
                            </label>
                            <p class="fw-bold mb-0 mt-1"
                               th:text="${user.experienceYears != null ?
                               user.experienceYears + ' Years' : '-'}">
                            </p>
                        </div>

                        <div class="col-md-6">
                            <label class="text-muted small
                                         text-uppercase fw-bold"
                                   style="letter-spacing:1px;
                                          font-size:11px;">
                                Skills
                            </label>
                            <p class="fw-bold mb-0 mt-1"
                               th:text="${user.skills ?: '-'}">
                            </p>
                        </div>

                        <div class="col-12"
                             th:if="${user.linkedinUrl}">
                            <label class="text-muted small
                                         text-uppercase fw-bold"
                                   style="letter-spacing:1px;
                                          font-size:11px;">
                                LinkedIn
                            </label>
                            <p class="mb-0 mt-1">
                                <a th:href="${user.linkedinUrl}"
                                   target="_blank"
                                   class="text-primary
                                          text-decoration-none">
                                    <i class="fab fa-linkedin me-1"></i>
                                    <span th:text="${user.linkedinUrl}">
                                    </span>
                                </a>
                            </p>
                        </div>

                        <div class="col-12"
                             th:if="${user.githubUrl}">
                            <label class="text-muted small
                                         text-uppercase fw-bold"
                                   style="letter-spacing:1px;
                                          font-size:11px;">
                                GitHub
                            </label>
                            <p class="mb-0 mt-1">
                                <a th:href="${user.githubUrl}"
                                   target="_blank"
                                   class="text-dark
                                          text-decoration-none">
                                    <i class="fab fa-github me-1"></i>
                                    <span th:text="${user.githubUrl}">
                                    </span>
                                </a>
                            </p>
                        </div>

                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
