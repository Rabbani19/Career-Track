<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Upload Document - CareerTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4 pb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="d-flex align-items-center mb-4">
                <a href="/documents"
                   class="btn btn-outline-secondary me-3">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <div>
                    <h3 class="fw-bold mb-0">
                        <i class="fas fa-cloud-upload-alt
                                  text-primary me-2"></i>
                        Upload Document
                    </h3>
                    <p class="text-muted mb-0">
                        Add a resume, cover letter, or other file
                    </p>
                </div>
            </div>

            <div class="card">
                <div class="card-body p-4">

                    <form th:action="@{/documents/upload}"
                          th:object="${documentDTO}"
                          method="post"
                          enctype="multipart/form-data">

                        <div class="row g-3">

                            <div class="col-12">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-tag
                                              text-primary"></i>
                                    Document Type *
                                </label>
                                <select th:field="*{documentType}"
                                        class="form-select"
                                        required>
                                    <option value="">
                                        Select Type
                                    </option>
                                    <option
                                            th:each="type : ${documentTypes}"
                                            th:value="${type}"
                                            th:text="${#strings.replace(
                                            type.name(), '_', ' ')}">
                                    </option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-paperclip
                                              text-primary"></i>
                                    File *
                                </label>
                                <input type="file"
                                       th:field="*{file}"
                                       class="form-control"
                                       accept=".pdf,.doc,.docx,.png,.jpg,.jpeg"
                                       required>
                                <small class="text-muted">
                                    PDF, DOC, DOCX, PNG or JPG.
                                    Max size 10MB.
                                </small>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-sticky-note
                                              text-primary"></i>
                                    Description
                                </label>
                                <textarea th:field="*{description}"
                                          class="form-control"
                                          rows="3"
                                          placeholder="Optional notes about this file...">
                                </textarea>
                            </div>

                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit"
                                    class="btn btn-primary px-4">
                                <i class="fas fa-cloud-upload-alt">
                                </i>
                                Upload
                            </button>
                            <a href="/documents"
                               class="btn btn-secondary px-4">
                                Cancel
                            </a>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
