<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Documents - CareerTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4 pb-5">

    <!-- Header -->
    <div class="d-flex justify-content-between
                align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-0">
                <i class="fas fa-folder-open
                          text-primary me-2"></i>
                Documents
            </h3>
            <p class="text-muted mb-0">
                Manage your resumes, cover letters &amp; more
            </p>
        </div>
        <a href="/documents/upload"
           class="btn btn-primary px-4">
            <i class="fas fa-cloud-upload-alt me-1"></i>
            Upload Document
        </a>
    </div>

    <!-- Flash Messages -->
    <div th:if="${successMessage}"
         class="alert alert-success">
        <i class="fas fa-check-circle"></i>
        <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}"
         class="alert alert-danger">
        <i class="fas fa-exclamation-circle"></i>
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- Stats -->
    <div class="row g-4 mb-4">

        <div class="col-lg-3 col-md-6">
            <div class="stat-card stat-primary">
                <div class="stat-card-icon">
                    <i class="fas fa-folder"></i>
                </div>
                <div class="stat-number"
                     th:text="${stats.total}">0</div>
                <div class="stat-label">Total Files</div>
            </div>
        </div>

        <div class="col-lg-3 col-md-6">
            <div class="stat-card stat-info">
                <div class="stat-card-icon">
                    <i class="fas fa-file-alt"></i>
                </div>
                <div class="stat-number"
                     th:text="${stats.resumes}">0</div>
                <div class="stat-label">Resumes</div>
            </div>
        </div>

        <div class="col-lg-3 col-md-6">
            <div class="stat-card stat-success">
                <div class="stat-card-icon">
                    <i class="fas fa-envelope-open-text"></i>
                </div>
                <div class="stat-number"
                     th:text="${stats.coverLetters}">0</div>
                <div class="stat-label">Cover Letters</div>
            </div>
        </div>

        <div class="col-lg-3 col-md-6">
            <div class="stat-card stat-warning">
                <div class="stat-card-icon">
                    <i class="fas fa-file"></i>
                </div>
                <div class="stat-number"
                     th:text="${stats.others}">0</div>
                <div class="stat-label">Others</div>
            </div>
        </div>

    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(documents)}"
         class="empty-state">
        <div class="empty-state-icon">
            <i class="fas fa-folder-open"></i>
        </div>
        <h5>No Documents Yet!</h5>
        <p>Upload your resume, cover letters and other files</p>
        <a href="/documents/upload"
           class="btn btn-primary">
            <i class="fas fa-cloud-upload-alt me-1"></i>
            Upload First Document
        </a>
    </div>

    <!-- Document Grid -->
    <div th:if="${!#lists.isEmpty(documents)}"
         class="row g-4">

        <div th:each="doc : ${documents}"
             class="col-lg-4 col-md-6">
            <div class="card h-100">
                <div class="card-body p-4">

                    <div class="d-flex align-items-center
                            gap-3 mb-3">
                        <div style="width:48px; height:48px;
                                border-radius:12px;
                                display:flex;
                                align-items:center;
                                justify-content:center;
                                background:var(--primary-light);
                                color:var(--primary);
                                font-size:20px;
                                flex-shrink:0;">
                        <span th:switch="${doc.documentType.name()}">
                            <i th:case="'RESUME'"
                               class="fas fa-file-alt"></i>
                            <i th:case="'COVER_LETTER'"
                               class="fas fa-envelope-open-text"></i>
                            <i th:case="'OFFER_LETTER'"
                               class="fas fa-award"></i>
                            <i th:case="'CERTIFICATE'"
                               class="fas fa-certificate"></i>
                            <i th:case="*"
                               class="fas fa-file"></i>
                        </span>
                        </div>
                        <div class="flex-grow-1"
                             style="min-width:0;">
                            <p class="fw-bold mb-0 text-truncate"
                               style="font-size:14px;"
                               th:text="${doc.documentName}">
                            </p>
                            <small class="text-muted"
                                   th:text="${#strings.replace(
                               doc.documentType.name(), '_', ' ')}">
                            </small>
                        </div>
                    </div>

                    <p th:if="${doc.description}"
                       class="text-muted mb-2"
                       style="font-size:13px;"
                       th:text="${doc.description}">
                    </p>

                    <div class="d-flex justify-content-between
                            align-items-center mb-3">
                        <small class="text-muted">
                            <i class="fas fa-hdd me-1"></i>
                            <span th:text="${#numbers.formatDecimal(
                              doc.fileSize / 1024.0, 1, 1)}">
                        </span> KB
                        </small>
                        <small class="text-muted">
                            <i class="fas fa-clock me-1"></i>
                            <span th:text="${#temporals.format(
                              doc.uploadedAt, 'dd MMM yyyy')}">
                        </span>
                        </small>
                    </div>

                    <div class="d-flex gap-2">
                        <a th:href="@{/documents/{id}/view(id=${doc.id})}"
                           target="_blank"
                           class="btn btn-outline-primary btn-sm">
                            <i class="fas fa-eye"></i>
                        </a>
                        <a th:href="@{/documents/{id}/download(id=${doc.id})}"
                           class="btn btn-primary btn-sm flex-grow-1">
                            <i class="fas fa-download me-1"></i>
                            Download
                        </a>
                        <form th:action="@{/documents/{id}/delete(id=${doc.id})}"
                              method="post"
                              onsubmit="return confirm(
          'Delete this document?');">
                            <button type="submit"
                                    class="btn btn-outline-danger btn-sm">
                                <i class="fas fa-trash"></i>
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
