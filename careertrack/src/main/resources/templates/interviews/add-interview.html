<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Schedule Interview - CareerTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <!-- Header -->
            <div class="d-flex align-items-center mb-4">
                <a href="/interviews"
                   class="btn btn-outline-secondary me-3">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <div>
                    <h3 class="fw-bold mb-0">
                        📅 Schedule Interview
                    </h3>
                    <p class="text-muted mb-0">
                        Add a new interview schedule
                    </p>
                </div>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">

                    <!-- Error Message -->
                    <div th:if="${errorMessage}"
                         class="alert alert-danger">
                        <i class="fas fa-exclamation-circle">
                        </i>
                        <span th:text="${errorMessage}">
                        </span>
                    </div>

                    <form th:action="@{/interviews/add}"
                          th:object="${interviewDTO}"
                          method="post">

                        <div class="row g-3">

                            <!-- Job Application -->
                            <div class="col-12">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-briefcase
                                              text-primary"></i>
                                    Job Application *
                                </label>
                                <select
                                        th:field="*{jobApplicationId}"
                                        class="form-select">
                                    <option value="">
                                        Select Job Application
                                    </option>
                                    <option
                                            th:each="app : ${applications}"
                                            th:value="${app.id}"
                                            th:text="${app.companyName}
                                        + ' - ' + ${app.jobRole}">
                                    </option>
                                </select>
                                <small class="text-danger"
                                       th:if="${#fields.hasErrors(
                                       'jobApplicationId')}"
                                       th:errors="*{jobApplicationId}">
                                </small>
                            </div>

                            <!-- Round Type -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-layer-group
                                              text-primary"></i>
                                    Round Type
                                </label>
                                <select th:field="*{roundType}"
                                        class="form-select">
                                    <option value="">
                                        Select Round Type
                                    </option>
                                    <option
                                            th:each="type : ${roundTypes}"
                                            th:value="${type}"
                                            th:text="${type}">
                                    </option>
                                </select>
                            </div>

                            <!-- Round Name -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-tag
                                              text-primary"></i>
                                    Round Name
                                </label>
                                <input type="text"
                                       th:field="*{roundName}"
                                       class="form-control"
                                       placeholder="e.g. Round 1, Final Round">
                            </div>

                            <!-- Interview Date -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-calendar
                                              text-primary"></i>
                                    Interview Date *
                                </label>
                                <input type="date"
                                       th:field="*{interviewDate}"
                                       class="form-control">
                                <small class="text-danger"
                                       th:if="${#fields.hasErrors(
                                       'interviewDate')}"
                                       th:errors="*{interviewDate}">
                                </small>
                            </div>

                            <!-- Interview Time -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-clock
                                              text-primary"></i>
                                    Interview Time
                                </label>
                                <input type="time"
                                       th:field="*{interviewTime}"
                                       class="form-control">
                            </div>

                            <!-- Interview Mode -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-video
                                              text-primary"></i>
                                    Interview Mode
                                </label>
                                <select th:field="*{mode}"
                                        class="form-select"
                                        id="modeSelect">
                                    <option value="">
                                        Select Mode
                                    </option>
                                    <option
                                            th:each="mode : ${modes}"
                                            th:value="${mode}"
                                            th:text="${mode}">
                                    </option>
                                </select>
                            </div>

                            <!-- Duration -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-hourglass
                                              text-primary"></i>
                                    Duration (Minutes)
                                </label>
                                <input type="number"
                                       th:field="*{durationMinutes}"
                                       class="form-control"
                                       placeholder="e.g. 60">
                            </div>

                            <!-- Meeting Link -->
                            <div class="col-12"
                                 id="meetingLinkDiv">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-link
                                              text-primary"></i>
                                    Meeting Link
                                </label>
                                <input type="url"
                                       th:field="*{meetingLink}"
                                       class="form-control"
                                       placeholder="Zoom/Meet/Teams link">
                            </div>

                            <!-- Interview Location -->
                            <div class="col-12"
                                 id="locationDiv">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-map-marker-alt
                                              text-primary"></i>
                                    Interview Location
                                </label>
                                <input type="text"
                                       th:field="*{interviewLocation}"
                                       class="form-control"
                                       placeholder="Office address">
                            </div>

                            <!-- Interviewer Name -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-user
                                              text-primary"></i>
                                    Interviewer Name
                                </label>
                                <input type="text"
                                       th:field="*{interviewerName}"
                                       class="form-control"
                                       placeholder="Interviewer name">
                            </div>

                            <!-- Interviewer Email -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-envelope
                                              text-primary"></i>
                                    Interviewer Email
                                </label>
                                <input type="email"
                                       th:field="*{interviewerEmail}"
                                       class="form-control"
                                       placeholder="Interviewer email">
                            </div>

                            <!-- Status -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-tasks
                                              text-primary"></i>
                                    Status
                                </label>
                                <select th:field="*{status}"
                                        class="form-select">
                                    <option value="">
                                        Select Status
                                    </option>
                                    <option
                                            th:each="status : ${statuses}"
                                            th:value="${status}"
                                            th:text="${status}">
                                    </option>
                                </select>
                            </div>

                            <!-- Notes -->
                            <div class="col-12">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-sticky-note
                                              text-primary"></i>
                                    Notes
                                </label>
                                <textarea
                                        th:field="*{notes}"
                                        class="form-control"
                                        rows="3"
                                        placeholder="Preparation notes, topics to study...">
                                </textarea>
                            </div>

                        </div>

                        <!-- Buttons -->
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit"
                                    class="btn btn-primary px-4">
                                <i class="fas fa-calendar-check">
                                </i>
                                Schedule Interview
                            </button>
                            <a href="/interviews"
                               class="btn btn-secondary px-4">
                                Cancel
                            </a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
