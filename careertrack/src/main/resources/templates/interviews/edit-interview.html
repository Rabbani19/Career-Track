<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Interview - CareerTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <!-- Header -->
            <div class="d-flex align-items-center mb-4">
                <a th:href="@{/interviews/{id}
                   (id=${interviewId})}"
                   class="btn btn-outline-secondary me-3">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <h3 class="fw-bold mb-0">
                    ✏️ Edit Interview
                </h3>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">

                    <form th:action="@{/interviews/{id}/edit
                          (id=${interviewId})}"
                          th:object="${interviewDTO}"
                          method="post">

                        <div class="row g-3">

                            <!-- Job Application -->
                            <div class="col-12">
                                <label class="form-label fw-bold">
                                    Job Application *
                                </label>
                                <select
                                        th:field="*{jobApplicationId}"
                                        class="form-select">
                                    <option
                                            th:each="app : ${applications}"
                                            th:value="${app.id}"
                                            th:text="${app.companyName}
                                        + ' - ' + ${app.jobRole}">
                                    </option>
                                </select>
                            </div>

                            <!-- Round Type -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    Round Type
                                </label>
                                <select th:field="*{roundType}"
                                        class="form-select">
                                    <option value="">
                                        Select Round Type
                                    </option>
                                    <option
                                            th:each="type : ${roundTypes}"
                                            th:value="${type}"
                                            th:text="${type}">
                                    </option>
                                </select>
                            </div>

                            <!-- Round Name -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    Round Name
                                </label>
                                <input type="text"
                                       th:field="*{roundName}"
                                       class="form-control">
                            </div>

                            <!-- Interview Date -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    Interview Date *
                                </label>
                                <input type="date"
                                       th:field="*{interviewDate}"
                                       class="form-control">
                            </div>

                            <!-- Interview Time -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    Interview Time
                                </label>
                                <input type="time"
                                       th:field="*{interviewTime}"
                                       class="form-control">
                            </div>

                            <!-- Mode -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    Interview Mode
                                </label>
                                <select th:field="*{mode}"
                                        class="form-select">
                                    <option value="">
                                        Select Mode
                                    </option>
                                    <option
                                            th:each="mode : ${modes}"
                                            th:value="${mode}"
                                            th:text="${mode}">
                                    </option>
                                </select>
                            </div>

                            <!-- Duration -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    Duration (Minutes)
                                </label>
                                <input type="number"
                                       th:field="*{durationMinutes}"
                                       class="form-control">
                            </div>

                            <!-- Meeting Link -->
                            <div class="col-12">
                                <label class="form-label fw-bold">
                                    Meeting Link
                                </label>
                                <input type="url"
                                       th:field="*{meetingLink}"
                                       class="form-control">
                            </div>

                            <!-- Location -->
                            <div class="col-12">
                                <label class="form-label fw-bold">
                                    Interview Location
                                </label>
                                <input type="text"
                                       th:field="*{interviewLocation}"
                                       class="form-control">
                            </div>

                            <!-- Interviewer Name -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    Interviewer Name
                                </label>
                                <input type="text"
                                       th:field="*{interviewerName}"
                                       class="form-control">
                            </div>

                            <!-- Interviewer Email -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    Interviewer Email
                                </label>
                                <input type="email"
                                       th:field="*{interviewerEmail}"
                                       class="form-control">
                            </div>

                            <!-- Status -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">
                                    Status
                                </label>
                                <select th:field="*{status}"
                                        class="form-select">
                                    <option
                                            th:each="status : ${statuses}"
                                            th:value="${status}"
                                            th:text="${status}">
                                    </option>
                                </select>
                            </div>

                            <!-- Notes -->
                            <div class="col-12">
                                <label class="form-label fw-bold">
                                    Notes
                                </label>
                                <textarea
                                        th:field="*{notes}"
                                        class="form-control"
                                        rows="3">
                                </textarea>
                            </div>

                            <!-- Feedback -->
                            <div class="col-12">
                                <label class="form-label fw-bold">
                                    Feedback
                                </label>
                                <textarea
                                        th:field="*{feedback}"
                                        class="form-control"
                                        rows="3"
                                        placeholder="Interview feedback...">
                                </textarea>
                            </div>

                        </div>

                        <!-- Buttons -->
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit"
                                    class="btn btn-primary px-4">
                                <i class="fas fa-save"></i>
                                Update Interview
                            </button>
                            <a th:href="@{/interviews/{id}
                               (id=${interviewId})}"
                               class="btn btn-secondary px-4">
                                Cancel
                            </a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
