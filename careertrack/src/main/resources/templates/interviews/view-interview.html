<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>View Interview - CareerTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <!-- Header -->
    <div class="d-flex align-items-center mb-4">
        <a href="/interviews"
           class="btn btn-outline-secondary me-3">
            <i class="fas fa-arrow-left"></i>
        </a>
        <h3 class="fw-bold mb-0">
            📋 Interview Details
        </h3>
    </div>

    <!-- Success Message -->
    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close"
                data-bs-dismiss="alert"></button>
    </div>

    <div class="row">

        <!-- Main Details -->
        <div class="col-md-8">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-white
                            d-flex justify-content-between
                            align-items-center">
                    <div>
                        <h5 class="fw-bold mb-0">
                            <i class="fas fa-building
                                      text-primary"></i>
                            <span th:text="${interview
                                  .jobApplication
                                  .companyName}">
                            </span>
                        </h5>
                        <small class="text-muted"
                               th:text="${interview
                               .jobApplication.jobRole}">
                        </small>
                    </div>
                    <div class="d-flex gap-2">
                        <a th:href="@{/interviews/{id}/edit
                           (id=${interview.id})}"
                           class="btn btn-sm btn-warning">
                            <i class="fas fa-edit"></i>
                            Edit
                        </a>
                        <form th:action="@{/interviews/{id}/delete
                              (id=${interview.id})}"
                              method="post"
                              onsubmit="return confirm(
                              'Delete this interview?')">
                            <button type="submit"
                                    class="btn btn-sm btn-danger">
                                <i class="fas fa-trash"></i>
                                Delete
                            </button>
                        </form>
                    </div>
                </div>

                <div class="card-body">
                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="text-muted small">
                                Round Type
                            </label>
                            <p class="fw-bold"
                               th:text="${interview.roundType ?: '-'}">
                            </p>
                        </div>

                        <div class="col-md-6">
                            <label class="text-muted small">
                                Round Name
                            </label>
                            <p class="fw-bold"
                               th:text="${interview.roundName ?: '-'}">
                            </p>
                        </div>

                        <div class="col-md-6">
                            <label class="text-muted small">
                                Interview Date
                            </label>
                            <p class="fw-bold"
                               th:text="${interview.interviewDate ?: '-'}">
                            </p>
                        </div>

                        <div class="col-md-6">
                            <label class="text-muted small">
                                Interview Time
                            </label>
                            <p class="fw-bold"
                               th:text="${interview.interviewTime ?: '-'}">
                            </p>
                        </div>

                        <div class="col-md-6">
                            <label class="text-muted small">
                                Mode
                            </label>
                            <p class="fw-bold"
                               th:text="${interview.mode ?: '-'}">
                            </p>
                        </div>

                        <div class="col-md-6">
                            <label class="text-muted small">
                                Duration
                            </label>
                            <p class="fw-bold"
                               th:text="${interview.durationMinutes != null ?
                               interview.durationMinutes + ' minutes' : '-'}">
                            </p>
                        </div>

                        <div class="col-md-6"
                             th:if="${interview.meetingLink}">
                            <label class="text-muted small">
                                Meeting Link
                            </label>
                            <p>
                                <a th:href="${interview.meetingLink}"
                                   target="_blank"
                                   class="btn btn-sm btn-outline-primary">
                                    <i class="fas fa-video"></i>
                                    Join Meeting
                                </a>
                            </p>
                        </div>

                        <div class="col-md-6"
                             th:if="${interview.interviewLocation}">
                            <label class="text-muted small">
                                Location
                            </label>
                            <p class="fw-bold"
                               th:text="${interview.interviewLocation}">
                            </p>
                        </div>

                        <div class="col-md-6">
                            <label class="text-muted small">
                                Interviewer Name
                            </label>
                            <p class="fw-bold"
                               th:text="${interview.interviewerName ?: '-'}">
                            </p>
                        </div>

                        <div class="col-md-6">
                            <label class="text-muted small">
                                Interviewer Email
                            </label>
                            <p class="fw-bold"
                               th:text="${interview.interviewerEmail ?: '-'}">
                            </p>
                        </div>

                        <div class="col-12"
                             th:if="${interview.notes}">
                            <label class="text-muted small">
                                Notes
                            </label>
                            <p th:text="${interview.notes}">
                            </p>
                        </div>

                        <div class="col-12"
                             th:if="${interview.feedback}">
                            <label class="text-muted small">
                                Feedback
                            </label>
                            <p th:text="${interview.feedback}">
                            </p>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <!-- Status & Actions -->
        <div class="col-md-4">

            <!-- Current Status -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-white">
                    <h6 class="fw-bold mb-0">
                        Interview Status
                    </h6>
                </div>
                <div class="card-body">

                    <div class="text-center mb-3">
                        <span class="badge fs-6 p-2"
                              th:text="${interview.status}"
                              th:classappend="${interview.status.name() == 'SCHEDULED' ? 'bg-primary' :
                                (interview.status.name() == 'COMPLETED' ? 'bg-success' :
                                (interview.status.name() == 'CANCELLED' ? 'bg-danger' : 'bg-warning text-dark'))}">
                        </span>
                    </div>

                    <form th:action="@{/interviews/{id}/status
                          (id=${interview.id})}"
                          method="post">
                        <select name="status"
                                class="form-select mb-2">
                            <option
                                    th:each="status : ${statuses}"
                                    th:value="${status}"
                                    th:text="${status}"
                                    th:selected="${interview.status
                                == status}">
                            </option>
                        </select>
                        <div class="d-grid">
                            <button type="submit"
                                    class="btn btn-primary">
                                Update Status
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Application Link -->
            <div class="card border-0 shadow-sm">
                <div class="card-body text-center">
                    <p class="text-muted small mb-2">
                        Linked Application
                    </p>
                    <a th:href="@{/applications/{id}
                       (id=${interview.jobApplication.id})}"
                       class="btn btn-outline-primary w-100">
                        <i class="fas fa-external-link-alt">
                        </i>
                        View Application
                    </a>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
